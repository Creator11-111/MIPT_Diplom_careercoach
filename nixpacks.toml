[phases.setup]
nixPkgs = ["python3", "gcc", "git", "git-lfs"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate",
  "pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "git lfs install",
  "git lfs pull"
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"

